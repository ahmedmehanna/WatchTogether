<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WatchTogether</title>
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 16px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px;
    }
    button {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border: none;
      border-radius: 6px;
      background: #4f46e5;
      color: white;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    button:disabled { background: #c7c7c7; cursor: default; }
    button.danger { background: #dc2626; }
    button.danger:hover { background: #b91c1c; }
    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
      text-transform: uppercase;
    }
    #link-input {
      text-transform: none;
    }
    #link-share-view {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }
    #link-share-label {
      font-size: 11px;
      color: #666;
      margin-bottom: 6px;
    }
    #server-status {
      font-size: 11px;
      margin-bottom: 10px;
      padding: 4px 0;
    }
    #status {
      font-size: 12px;
      padding: 8px;
      border-radius: 6px;
      background: #f4f4f5;
      margin-top: 8px;
      min-height: 32px;
    }
    #in-party-view {
      display: none;
      text-align: center;
    }
    #in-party-label {
      font-size: 12px;
      color: #555;
      margin-bottom: 4px;
    }
    #code-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 4px 0 14px;
    }
    #code-display {
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 3px;
    }
    #copy-btn {
      width: auto;
      padding: 4px 10px;
      margin: 0;
      font-size: 11px;
      background: #e0e7ff;
      color: #4f46e5;
      border-radius: 5px;
    }
    #copy-btn:hover { background: #c7d2fe; }
    .divider {
      text-align: center;
      color: #999;
      font-size: 11px;
      margin: 10px 0;
    }
    #site-status {
      font-size: 11px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <h1>WatchTogether</h1>

  <div id="server-status">Checking signaling server...</div>
  <div id="site-status"></div>

  <div id="pre-party-view">
    <button id="start-btn">Start Party</button>
    <div class="divider">— or —</div>
    <input id="join-code" placeholder="Enter party code" maxlength="6" />
    <button id="join-btn">Join Party</button>
  </div>

  <div id="in-party-view">
    <div id="in-party-label">You're in a party</div>
    <div id="code-row">
      <div id="code-display"></div>
      <button id="copy-btn">Copy</button>
    </div>
    <button id="leave-btn" class="danger">Leave Party</button>

    <div id="link-share-view">
      <div id="link-share-label">Share a link — opens on your partner's browser too</div>
      <input id="link-input" placeholder="Paste a YouTube/Netflix/etc. URL" />
      <button id="send-link-btn">Send Link</button>
    </div>
  </div>

  <div id="status">Not connected.</div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
